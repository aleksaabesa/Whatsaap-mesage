<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Hospital OTP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 300px; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { padding: 12px; width: 90%; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; outline: none; font-size: 16px; }
        .wa-btn { background: #25D366; color: white; padding: 15px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; display: block; font-weight: bold; transition: 0.3s; width: 100%; }
        .wa-btn:hover { background: #128C7E; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Hospital 🏥</h2>
        <p>შეიყვანეთ ნომერი კოდის მისაღებად</p>
        
        <input type="text" id="phone" placeholder="მაგ: 555683731">
        
        <button onclick="sendOTP()" class="wa-btn">WhatsApp-ით მიღება</button>
    </div>

    <script>
        function sendOTP() {
            let phone = document.getElementById('phone').value.trim();
            
            if(!phone) {
                alert("გთხოვთ შეიყვანოთ ნომერი!");
                return;
            }

            // თუ ნომერი იწყება 5-იანით, დავუმატოთ ქვეყნის კოდი 995
            if(phone.startsWith('5')) {
                phone = '995' + phone;
            }

            const code = Math.floor(1000 + Math.random() * 9000);
            const message = `🏥 *HOSPITAL*\n\nგამარჯობა, თქვენი ავტორიზაციის კოდია: *${code}*`;
            const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            
            window.open(waUrl, '_blank');
        }
    </script>

</body>
</html>
